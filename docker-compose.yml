# docker-compose.yml — local development only
# DB is hosted on Supabase; no local postgres container needed.
# For production, deploy directly via Render using the Dockerfile.

services:
  backend:
    build: ./backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend/prompts:/app/prompts
      - ./backend/knowledge_base:/app/knowledge_base