

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: mediauth
      POSTGRES_USER: mediauth_user
      POSTGRES_PASSWORD: mediauth_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediauth_user -d mediauth"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    env_file:
      - .env
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://mediauth_user:mediauth_pass@db:5432/mediauth
      GROQ_API_KEY: ${GROQ_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      ENVIRONMENT: production
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/prompts:/app/prompts
      - ./backend/knowledge_base:/app/knowledge_base

volumes:
  postgres_data: