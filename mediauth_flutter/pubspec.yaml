publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  go_router: ^14.2.7
  intl: ^0.19.0
  file_picker: ^8.1.7
  dotted_border: ^2.1.0
  http: ^1.6.0
  flutter_dotenv: ^5.1.0
  app_links: ^7.0.0
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
